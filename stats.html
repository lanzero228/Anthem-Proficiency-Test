<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика | АПТ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <img src="logo.png" alt="Логотип АПТ" class="logo">
        <h1>Статистика прохождения</h1>
        <a href="index.html" class="btn-stats">На главную</a>
    </header>

    <main>
        <section class="card">
            <h2>Статистика по группам</h2>

            <!-- ВОТ ЭТА ОБЕРТКА ОЧЕНЬ ВАЖНА -->
            <div class="table-responsive">
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th>Группа</th>
                            <th>Попыток</th>
                            <th>Средний балл (%)</th>
                            <th>Лучший результат</th>
                        </tr>
                    </thead>
                    <tbody id="group-stats-body">
                        <!-- Заполняется через JS -->
                    </tbody>
                </table>
            </div>

        </section>
    </main>

    <script src="stats.js"></script>
</body>

</html>
