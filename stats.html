<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика | АПТ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Живой фон -->
    <div class="bg-container"></div>
    <div class="bg-overlay"></div>

    <header>
        <img src="logo.png" alt="Логотип АПТ" class="logo">
        <h1>Статистика прохождения</h1>
        <a href="index.html" class="btn-stats">На главную</a>
    </header>

    <main>
        <section class="card">
            <h2>Общая статистика по колледжу</h2>
            <div id="global-stats" class="stats-grid">
                <!-- Заполняется через JS -->
            </div>
        </section>

        <section class="card">
            <h2>Статистика по группам</h2>
            <!-- Обертка для скролла таблицы на телефонах -->
            <div class="table-responsive">
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th>Группа</th>
                            <th>Попыток</th>
                            <th>Средний балл (%)</th>
                            <th>Лучший результат</th>
                        </tr>
                    </thead>
                    <tbody id="group-stats-body">
                        <!-- Заполняется через JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Подключение Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // Ваши ключи
        const firebaseConfig = {
            apiKey: "AIzaSyBjaXAX5O39EUgY6XDAL_M_c9mn_kghEJI",
            authDomain: "anthem-proficiency-test.firebaseapp.com",
            projectId: "anthem-proficiency-test",
            storageBucket: "anthem-proficiency-test.firebasestorage.app",
            messagingSenderId: "326113745350",
            appId: "1:326113745350:web:4895915a07046acf7e7ac7",
            measurementId: "G-0JK9X52FZH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Функция для получения данных из облака, которую будет использовать stats.js
        window.getResultsFromFirebase = async () => {
            const querySnapshot = await getDocs(collection(db, "results"));
            const results = [];
            querySnapshot.forEach((doc) => {
                results.push(doc.data());
            });
            return results;
        };
    </script>
    
    <!-- Подключение логики статистики -->
    <script src="stats.js"></script>
</body>
</html>
